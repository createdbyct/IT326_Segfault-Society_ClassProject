[project]
name = "rate-my-classes-backend"
version = "0.1.0"
description = "FastAPI backend for Rate My Classes (IT326 Segfault Society)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
    "python-dotenv>=1.2.4",
    "psycopg2-binary>=2.9.13",
]

[tool.uv]
# This is an app, not a library, so uv shouldn't try to build/install it
package = false
